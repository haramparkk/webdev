<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="905" font-family="Arial" fill="#182b3a"><g transform="translate(0 0)"><rect width="700" height="670" fill="#faf8f4"/><text x="36" y="50" font-size="21">Fantasy Basketball</text><text x="394" y="50" font-size="17">My Team     Trade Analyzer</text><path d="M36 72h628" stroke="#aaa"/><text x="36" y="109" font-size="16">2026–27 NBA season · 12-player pool</text><text x="36" y="142" font-size="16">League scoring rules</text><text x="36" y="207" font-size="38">My Team</text><text x="36" y="249" font-size="16">1 player · 47.4 combined fantasy PPG</text><text x="36" y="301" font-size="19">Stephen Curry · 47.4 fantasy PPG</text><text x="36" y="328" font-size="14">29.2 PTS · 3.8 REB · 4 AST</text><text x="565" y="310" font-size="16">Remove</text><text x="36" y="403" font-size="26">Available players</text><text x="36" y="442" font-size="16">Search by name</text><rect x="36" y="454" width="285" height="40" fill="white" stroke="#888"/><text x="49" y="480" font-size="16">Nikola</text><text x="36" y="547" font-size="19">Nikola Jokic · 52.6 fantasy PPG</text><text x="36" y="574" font-size="14">21.2 PTS · 9.8 REB · 9.2 AST</text><text x="575" y="558" font-size="16">Add</text></g><g transform="translate(720 0)"><rect width="700" height="670" fill="#faf8f4"/><text x="36" y="50" font-size="21">Fantasy Basketball</text><text x="394" y="50" font-size="17">My Team     Trade Analyzer</text><path d="M36 72h628" stroke="#aaa"/><text x="36" y="109" font-size="16">2026–27 NBA season · 12-player pool</text><text x="36" y="142" font-size="16">League scoring rules</text><text x="36" y="207" font-size="38">Trade Analyzer</text><text x="36" y="249" font-size="16">Compare a one-for-one swap using season averages.</text><text x="36" y="300" font-size="16">You give</text><rect x="36" y="310" width="285" height="40" fill="white" stroke="#888"/><text x="49" y="336" font-size="16">Stephen Curry (47.4)</text><text x="36" y="389" font-size="16">You receive</text><rect x="36" y="399" width="285" height="40" fill="white" stroke="#888"/><text x="49" y="425" font-size="16">Nikola Jokic (52.6)</text><text x="36" y="486" font-size="19">Your team would gain 5.2 fantasy PPG.</text></g><g transform="translate(0 685)"><rect width="1420" height="220" fill="#faf8f4"/>
<text x="36" y="44" font-size="27" font-weight="bold">How the app works</text>
<text x="36" y="91" font-size="19">1   Load player stats</text><text x="36" y="123" font-size="15">React asks ESPN for season averages over HTTPS.</text><text x="36" y="148" font-size="15">If the request fails, it uses saved player stats.</text>
<text x="508" y="91" font-size="19">2   Save the roster</text><text x="508" y="123" font-size="15">Add or Remove sends a request to Express.</text><text x="508" y="148" font-size="15">SQLite stores player IDs so the team survives a refresh.</text>
<text x="986" y="91" font-size="19">3   Compare a trade</text><text x="986" y="123" font-size="15">React scores each player using the league rules.</text><text x="986" y="148" font-size="15">Incoming score minus outgoing score gives the change.</text></g></svg>



